# Boundary and Overlap Matrix — Master Build Directive §B
# GENERATED. Governs handoffs and occupational separation.
# Controlling rule: where a detailed role contract is more specific than a
# matrix entry, the ROLE CONTRACT controls. The matrix never authorizes a
# role to absorb work its full definition excludes.
# 'Agent handoff is not failure. It is required behavior when an
#  occupational boundary is reached.'
controlling_rule: |
  Boundary-matrix controlling rule
  The matrix supplements the full occupational definitions.
  Where a detailed role contract is more specific than a short matrix entry, the detailed role contract controls.
  The matrix does not authorize a role to absorb work excluded by its full definition.
  Agent handoff is not failure.
  It is required behavior when an occupational boundary is reached.
